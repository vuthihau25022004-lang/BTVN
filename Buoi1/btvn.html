<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTVN</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 50px 40px;
        font-family: Arial, Helvetica, sans-serif;
        background-color: white;
      }

      .container {
        width: 100%;
        max-width: 610px;
      }

      h2 {
        margin: 0 0 14px 0;
        font-size: 30px;
        font-weight: 400;
        color: #333;
      }

      textarea {
        width: 100%;
        height: 100px;
        padding: 14px 18px;
        font-size: 20px;
        font-family: Arial, Helvetica, sans-serif;
        color: #777;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
        resize: both;
      }

      textarea:focus {
        border-color: #aaa;
      }

      .counter {
        margin-top: 14px;
        margin-bottom: 30px;
        font-size: 20px;
        color: #d32f2f;
      }

      hr {
        border: none;
        border-top: 1px solid #ddd;
        margin: 0 0 30px 0;
      }

      input {
        width: 100%;
        height: 60px;
        padding: 14px 18px;
        font-size: 20px;
        font-family: Arial, Helvetica, sans-serif;
        color: #777;
        border: 2px solid #bfc7cc;
        border-radius: 7px;
        outline: none;
      }

      input:focus {
        border-color: #8e9ba3;
        box-shadow: 0 0 4px rgba(100, 120, 130, 0.4);
      }

      .input-counter {
        margin-top: 14px;
        font-size: 20px;
        color: #d32f2f;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Textarea</h2>

      <textarea id="textarea" maxlength="140"></textarea>

      <div class="counter">
        Max
        <span id="textarea-count">0</span>
        / 140
      </div>

      <hr />

      <h2>Input Field</h2>

      <input type="text" id="input" maxlength="20" />

      <div class="input-counter">
        Maximum
        <span id="input-count">0</span>
        / 20
      </div>
    </div>

    <script>
      const textarea = document.getElementById("textarea");
      const textareaCount = document.getElementById("textarea-count");

      const input = document.getElementById("input");
      const inputCount = document.getElementById("input-count");

      textarea.addEventListener("input", function () {
        textareaCount.textContent = textarea.value.length;
      });

      input.addEventListener("input", function () {
        inputCount.textContent = input.value.length;
      });
    </script>
  </body>
</html>
